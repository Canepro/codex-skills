name: Check skills

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install skills into runner surfaces
        run: bash scripts/install.sh

      - name: Test portable-to-vendor ownership handoff
        run: bash tests/test-install-vendor-handoff.sh

      - name: Run drift-safe repository checks
        run: bash scripts/check-drift.sh
